// Reviewed and updated with assistance from Claude Opus 4.8 (July 2026)
// and ChatGPT-6.1 Sol (October 2026).
plugins {
	id 'java'
	id 'application'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'es.deusto.sd.auctions.client'
version = '1.0'

repositories {
	mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
	// Spring Boot Starter Web for building web applications
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Latest stable Commons Codec, explicitly overriding Spring Boot's managed version.
    implementation 'commons-codec:commons-codec:1.22.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Task to run the console client
task runConsoleClient(type: JavaExec) {
    group = 'application'
    description = 'Run the Console Client'
    mainClass = 'es.deusto.sd.auctions.client.console.ConsoleClient'
    classpath = sourceSets.main.runtimeClasspath
}

// Task to run the swing client
task runSwingClient(type: JavaExec) {
    group = 'application'
    description = 'Run the Swing Client'
    mainClass = 'es.deusto.sd.auctions.client.swing.SwingClientGUI'
    classpath = sourceSets.main.runtimeClasspath
}

// Spring Boot configuration, defaults to running the web client
bootRun {
    mainClass.set("es.deusto.sd.auctions.client.web.WebClientApplication")
}

application {
    mainClass = "es.deusto.sd.auctions.client.web.WebClientApplication"
}

springBoot {
    mainClass = "es.deusto.sd.auctions.client.web.WebClientApplication"
}
