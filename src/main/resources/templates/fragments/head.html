<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
	<meta charset="UTF-8">
	<!-- Preconnect to Google Fonts early to eliminate font load delays -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=optional" rel="stylesheet">

	<!-- Day/Night mode: apply the saved theme (or the OS preference) BEFORE the page
	     renders, to avoid a flash of the wrong colours. Bootstrap 5.3 reads the
	     data-bs-theme attribute on <html> and re-themes every component automatically. -->
	<script>
		(function () {
			const saved = localStorage.getItem('theme');
			const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
			document.documentElement.setAttribute('data-bs-theme', theme);
		})();
	</script>
	<title th:text="${pageTitle}">Auctions App</title>
	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- Font Awesome -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/css/all.min.css">
	<style>
		body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
	</style>
</head>
</html>
