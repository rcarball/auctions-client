<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Categories')}"></head>
<body>
	<!-- Header with logo and name -->
	<header th:replace="~{fragments/header :: header}"></header>

	<!-- Navigation bar -->
	<nav class="navbar bg-body-tertiary shadow-sm">
	    <div class="container-fluid d-flex align-items-center">
	        <!-- Right-aligned controls -->
	        <div class="ms-auto d-flex align-items-center">
	            <a th:if="${token == null}" th:href="@{/login(redirectUrl=${currentUrl})}"
	               class="btn btn-primary btn-sm d-flex align-items-center">
	                <i class="fas fa-sign-in-alt me-2"></i> Login
	            </a>
	            <a th:if="${token != null}" th:href="@{/logout(redirectUrl=${currentUrl})}"
	               class="btn btn-danger btn-sm d-flex align-items-center">
	                <i class="fas fa-sign-out-alt me-2"></i> Logout
	            </a>
	            <!-- Day/Night toggle button -->
	            <button type="button" id="themeToggle" class="btn btn-outline-secondary btn-sm ms-2"
	                    title="Toggle light/dark mode" aria-label="Toggle theme">
	                <i class="fas fa-moon"></i>
	            </button>
	        </div>
	    </div>
	</nav>

    <div class="container mt-4">
        <h1>Categories</h1>
        <p>Select a category to view available articles.</p>

		<div class="list-group">
		    <a th:each="category : ${categories}"
		       th:href="@{/category/{name}(name=${category.name}, currency=${selectedCurrency ?: 'EUR'})}"
		       class="list-group-item list-group-item-action">
		        <span th:text="${category.name}"></span>
		    </a>
		</div>
		<br>
		<p th:if="${errorMessage}" th:text="${errorMessage}" class="text-danger mt-3"></p>
		<br>
    </div>

		<footer th:replace="~{fragments/footer :: footer}"></footer>

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	<!-- Day/Night toggle behaviour: flip data-bs-theme and remember the choice -->
	<script>
		(function () {
			const btn = document.getElementById('themeToggle');
			if (!btn) return;
			const icon = btn.querySelector('i');
			function syncIcon() {
				const dark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
				icon.className = dark ? 'fas fa-sun' : 'fas fa-moon';
			}
			syncIcon();
			btn.addEventListener('click', function () {
				const next = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
				document.documentElement.setAttribute('data-bs-theme', next);
				localStorage.setItem('theme', next);
				syncIcon();
			});
		})();
	</script>
</body>
</html>
