spring.application.name=auctions-client
spring.output.ansi.enabled=ALWAYS
# Port for the web client infrastructure. This is the port where the web client will be served.
server.port=8083
# API base URL shared by the web, console and Swing clients.
# V1 uses port 8081; V2 uses port 8082. API_BASE_URL overrides this value.
# Persistence belongs to the server: V1 resets on restart, V2 stores data on disk.
# Changing this URL does not change the server database or its persistence policy.
api.base.url=http://localhost:8082
# Logging message pattern
logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%-5level) %clr(%-35.35logger{0}){cyan} : %msg%n